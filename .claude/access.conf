# Claude harness access grants.
# Keep this file machine-local in spirit: broad grants should be temporary and reviewed.

allow_external_write=false
allow_external_delete=false

# Optional colon-separated roots. When a root list is empty and the corresponding
# allow_external_* flag is true, all non-critical external paths are allowed.
external_write_roots=
external_delete_roots=

# Maintainer mode allows .claude/** writes/deletes through the access guard.
maintainer_mode=false
