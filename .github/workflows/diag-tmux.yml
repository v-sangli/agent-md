name: diag-tmux
on:
  push:
    branches: [fix/tmux-36-wrap]
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - name: Reproduce
        run: |
          tc="$PWD/.claude/skills/tmux-control/scripts/tmux_control.sh"
          export CLAUDE_CODE_SESSION_ID=verify-1
          hostname; tmux -V
          A="'$tc' start --session a >/dev/null && '$tc' send --target a::run --command 'printf %0120d%s\\\\n 0 WRAPEND' >/dev/null && '$tc' wait --target a::run --pattern '0{100}WRAPEND' --timeout 5 --interval 1 >/dev/null"
          bash -lc "$A" && echo "A: PASS" || { echo "A: FAIL"; tmux capture-pane -p -t a:control.0 -S -50 | grep -v '^$' | tail -6; }
          "$tc" stop --session a >/dev/null
          B="'$tc' start --session b >/dev/null && '$tc' send --target b::run --command 'echo READY' >/dev/null && '$tc' wait --target b::run --pattern '^READY\$' --timeout 10 --interval 1 >/dev/null && '$tc' send --target b::run --command 'printf %0120d%s\\\\n 0 WRAPEND' >/dev/null && '$tc' wait --target b::run --pattern '0{100}WRAPEND' --timeout 5 --interval 1 >/dev/null"
          bash -lc "$B" && echo "B: PASS" || { echo "B: FAIL"; tmux capture-pane -p -t b:control.0 -S -50 | grep -v '^$' | tail -6; }
          "$tc" stop --session b >/dev/null
